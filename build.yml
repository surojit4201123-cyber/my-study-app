name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Bubblewrap CLI
      run: npm install -g @bubblewrap/cli

    - name: Generate Android Project Configuration
      run: |
        npx @bubblewrap/cli init --manifest="https://surojit4201123-cyber.github.io/study-zone-app/manifest.json" --directory=android-app --metaData="{\"appName\":\"Study Zone\",\"appId\":\"com.surojit.studyzone\",\"versionName\":\"1.0.0\"}" --skipValidation

    - name: Build APK File
      run: |
        cd android-app
        npx @bubblewrap/cli build --skipSigning

    - name: Upload Generated APK
      uses: actions/upload-artifact@v4
      with:
        name: Study-Zone-APK
        path: "android-app/*.apk"